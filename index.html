<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>核能发电厂三维可视化</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>核能发电厂</h1>
            <p>压水堆核电站能量转换流程</p>
          </div>
        </div>
        <nav class="phase-tabs" aria-label="流程阶段">
          <button class="phase-tab active" data-step="0" title="核裂变">
            <i data-lucide="atom"></i>
            <span>核裂变</span>
          </button>
          <button class="phase-tab" data-step="1" title="一回路传热">
            <i data-lucide="thermometer"></i>
            <span>一回路</span>
          </button>
          <button class="phase-tab" data-step="2" title="蒸汽驱动汽轮机">
            <i data-lucide="waves"></i>
            <span>蒸汽</span>
          </button>
          <button class="phase-tab" data-step="3" title="发电与升压">
            <i data-lucide="zap"></i>
            <span>发电</span>
          </button>
          <button class="phase-tab" data-step="4" title="冷凝与冷却">
            <i data-lucide="snowflake"></i>
            <span>冷却</span>
          </button>
        </nav>
      </header>

      <aside class="info-panel" aria-label="核电流程说明">
        <section class="step-summary">
          <div class="step-kicker">当前阶段</div>
          <h2 id="step-title">核裂变释放热量</h2>
          <p id="step-description">
            铀燃料组件在反应堆压力容器内发生受控链式裂变，控制棒调节中子通量，产生稳定热功率。
          </p>
        </section>

        <section class="metric-grid" aria-label="运行参数">
          <div class="metric">
            <span>反应堆热功率</span>
            <strong id="metric-thermal">3210 MWt</strong>
          </div>
          <div class="metric">
            <span>电功率输出</span>
            <strong id="metric-electric">1080 MWe</strong>
          </div>
          <div class="metric">
            <span>一回路压力</span>
            <strong>15.5 MPa</strong>
          </div>
          <div class="metric">
            <span>热效率</span>
            <strong id="metric-efficiency">33.6%</strong>
          </div>
        </section>

        <section class="legend" aria-label="流体图例">
          <div><span class="dot hot"></span>高温一回路冷却剂</div>
          <div><span class="dot cool"></span>降温回流冷却剂</div>
          <div><span class="dot steam"></span>二回路蒸汽</div>
          <div><span class="dot electric"></span>电能输出</div>
          <div><span class="dot water"></span>循环冷却水</div>
        </section>
      </aside>

      <aside class="control-panel" aria-label="可视化控制">
        <button id="toggle-run" class="icon-button primary" title="暂停或继续动画">
          <i data-lucide="pause"></i>
        </button>
        <button id="reset-view" class="icon-button" title="重置视角">
          <i data-lucide="rotate-ccw"></i>
        </button>
        <label class="speed-control">
          <span>流速</span>
          <input id="speed" type="range" min="0.4" max="2.4" step="0.1" value="1" />
        </label>
      </aside>

      <footer class="timeline" aria-label="能量转换链">
        <div class="timeline-item active" data-step="0">裂变热</div>
        <div class="timeline-item" data-step="1">高压传热</div>
        <div class="timeline-item" data-step="2">蒸汽做功</div>
        <div class="timeline-item" data-step="3">机械转电能</div>
        <div class="timeline-item" data-step="4">冷凝循环</div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
